name: Metrik POS CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# No workflow-level concurrency group is configured deliberately.
# CI runs are isolated (temporary SQLite DB and array cache/session), so allowing
# multiple runs to execute independently avoids concurrency-based cancellation.

jobs:
  validate:
    name: Validate Laravel and Vue application
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    env:
      APP_ENV: testing
      APP_DEBUG: "false"
      APP_URL: http://localhost
      DB_CONNECTION: sqlite
      DB_DATABASE: database/ci.sqlite
      # Keep rate-limit counters isolated between test cases; a file cache can
      # persist throttle hits across the suite and cause unrelated 429 failures.
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: database
      MAIL_MAILER: log
      FILESYSTEM_DISK: local

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: curl, dom, fileinfo, mbstring, openssl, pdo_sqlite, sqlite3, tokenizer, xml
          coverage: none
          tools: composer:v2

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Validate Composer metadata
        run: composer validate --no-check-publish

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare isolated CI environment
        shell: bash
        run: |
          test -f .env.example || { echo 'Missing .env.example'; exit 1; }
          cp .env.example .env
          mkdir -p database
          touch database/ci.sqlite
          php artisan key:generate --force

      - name: Check production PHP platform requirements
        run: composer check-platform-reqs --no-dev

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      - name: Run Laravel migrations
        run: php artisan migrate --force

      - name: Run automated test suite
        run: php artisan test

      - name: Run strict application health check
        run: php artisan metrik:health-check --strict
